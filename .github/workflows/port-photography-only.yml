name: Port to photography-only (one-shot)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/port-photography-only.yml"
      - "tools/port_patch.py"
      - "tools/build_search_index.py"
      - "README.md"
      - "_SPEC.md"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  port-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply photography-only port
        run: python3 tools/port_patch.py
      - name: Commit, push, and clean up this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q .github/workflows/port-photography-only.yml tools/port_patch.py
          git add -A
          git commit -m "Port library to photography-dedicated content

Removes the eleven non-photography field studios and the Fields hub,
restores the photography-only navigation, footer, and branding, and
regenerates the client-side search index (674 entries, 15 pages)."
          git push
      - name: Build
        run: npm ci && npm run build
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
